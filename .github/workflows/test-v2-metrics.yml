name: Test v2.0 — Build Jan-Feb Metrics

on:
  workflow_dispatch:

jobs:
  build-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run v2.0 metrics builder
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/test_v2_build_metrics.py --config test_v2_run/v2_config.json --out test_v2_run/v2_stratification_metrics.csv

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2_stratification_metrics
          path: test_v2_run/v2_stratification_metrics.csv
